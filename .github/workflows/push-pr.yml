on:
  push:
    branches:
      - master
      - "release/*"
    paths:
      - "src/**"
  pull_request:
    branches:
      - master
      - "release/*"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: run tests
        run: npm run test
