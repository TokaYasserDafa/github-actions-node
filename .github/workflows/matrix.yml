name: Node Matrix Test

on:
  workflow_dispatch:

jobs:
  job_1:
    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

        node_version:
          - 20.x
          - 22.x
          - 24.x

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - name: Check Node.js version
        run: node --version

      - name: Check npm version
        run: npm --version